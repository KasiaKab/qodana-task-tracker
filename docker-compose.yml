services:
  mongodb:
    image: mongo:7.0
    container_name: tasktracker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tasktracker
    networks:
      - tasktracker-net

  my-qodana-app:
    build: .
    container_name: tasktracker-app
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/tasktracker
    depends_on:
      - mongodb
    networks:
      - tasktracker-net

volumes:
  mongo-data:

networks:
  tasktracker-net:
    driver: bridge